
<!DOCTYPE html>
<html>
<head>

<title>Lumina Admin</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',system-ui;}
body{background:#f7f3eb;min-height:100vh;overflow-x:hidden;}
.header{background:#111;color:#D4AF37;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;flex-wrap:wrap;gap:10px;}
.header h1{font-size:18px;font-weight:900;flex:1;min-width:120px;}
/* === TABS - Scrollable, no scatter, no cut === */
.tabs{
  display:flex;
  flex-wrap:nowrap; /* NEVER wrap — keep for one line */
  gap:6px;
  padding:12px 12px;
  overflow-x:auto; /* scroll left-right */
  overflow-y:hidden;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
  scroll-snap-type:x proximity;
  width:100%;
  max-width:100%;
  box-sizing:border-box;
}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  flex:0 0 auto; /* NEVER shrink, NEVER grow — keep size */
  padding:10px 14px;
  border-radius:12px;
  border:1px solid #d9cdb0;
  background:white;
  font-weight:900;
  font-size:11px;
  cursor:pointer;
  white-space:nowrap; /* NEVER break text to 2 lines */
  scroll-snap-align:start;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.tab.active{background:#111;color:#D4AF37;border-color:#111;}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;padding:0 16px 16px;}
.stat-card{background:white;border-radius:16px;padding:14px;border:1px solid #e8e0cc;text-align:center;}
.stat-card b{font-size:20px;display:block;}
.stat-card p{font-size:10px;color:#888;font-weight:700;margin-top:4px;text-transform:uppercase;}
.stat-card.gold{background:linear-gradient(135deg,#111,#2a2a2a);border:1px solid #D4AF37;}
.stat-card.gold b{color:#D4AF37;}
.controls{padding:0 16px 16px;display:flex;gap:8px;}
.controls input,.controls select{flex:1;padding:12px;border-radius:12px;border:1px solid #d9cdb0;background:white;font-weight:600;font-size:12px;min-width:0;}
#list{padding:0 16px 100px;display:grid;gap:12px;}
.card{background:white;border-radius:20px;padding:16px;border:1px solid #eee;box-shadow:0 2px 12px rgba(0,0,0,0.04);position:relative;overflow:hidden;}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:#D4AF37;}
.code{font-weight:900;background:#111;color:#D4AF37;padding:4px 10px;border-radius:8px;font-size:11px;}
.status{padding:5px 10px;border-radius:20px;font-size:10px;font-weight:900;text-transform:uppercase;}
.Paid,.Approved{background:#dcfce7;color:#166534;}.Awaiting{background:#fee2e2;color:#991b1b;}.Unpaid{background:#fef3c7;color:#92400e;}.Cancelled{background:#f3f4f6;color:#666;}.Checked-In{background:#111;color:#D4AF37;}.Disapproved{background:#fee2e2;color:#991b1b;}.Checked-Out{background:#dbeafe;color:#1e40af;}
.actions{margin-top:12px;display:grid;gap:8px;}
.actions.two{grid-template-columns:1fr 1fr;}.actions.three{grid-template-columns:1fr 1fr 1fr;}
.actions button{padding:11px;border-radius:12px;border:none;font-size:11px;font-weight:800;cursor:pointer;}
.actions button:disabled{opacity:0.35;pointer-events:none;}
.btn-approve{background:#111;color:#D4AF37;}.btn-disapprove{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5!important;}.btn-check{background:#D4AF37;color:#111;}.btn-cancel{background:#f5f5f5;color:#999;border:1px solid #ddd!important;}.btn-delete{background:#000;color:white;}
.room-card{background:white;border-radius:20px;padding:16px;border:1px solid #e8e0cc;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.room-card b{font-size:14px;}
.room-card input{width:65px;padding:8px;border-radius:8px;border:1px solid #d9cdb0;text-align:center;font-weight:800;}
.room-number-input{appearance:textfield;-moz-appearance:textfield;-webkit-appearance:none;}
#addModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:100;align-items:center;justify-content:center;padding:16px;}
#addModal.open{display:flex;}
.modal-box{background:white;border-radius:20px;padding:20px;width:100%;max-width:400px;max-height:90vh;overflow-y:auto;}
.modal-box h2{font-size:16px;font-weight:900;margin-bottom:12px;}
.modal-box input,.modal-box select{width:100%;padding:12px;border-radius:10px;border:1px solid #d9cdb0;margin-bottom:10px;font-weight:600;}
#loginScreen.hidden{display:none!important;}
/* === MOBILE TABS - Tight, scrollable, no scatter === */
@media(max-width:600px){
  .header{padding:12px 12px;gap:8px;}
  .header h1{font-size:14px;min-width:100px;}
  .tabs{
    padding:8px 10px;
    gap:6px;
    flex-wrap:nowrap; /* Force one line even for mobile */
    overflow-x:auto;
    overflow-y:hidden;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    /* Hide scrollbar but still scrollable */
    -ms-overflow-style:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto; /* Don't shrink */
    padding:9px 12px;
    font-size:10px;
    border-radius:11px;
    white-space:nowrap;
    min-width:max-content; /* Make tab as wide as its text, no squeeze */
  }
  .stats{gap:8px;padding:0 10px 12px;}
  #list{padding:0 10px 100px;}
  .room-card{flex-direction:column;align-items:flex-start;}
}

/* ===== WEBSITE EDITOR - LUMINA LUXURY STYLE ===== */
.ed-wrap{font-family:inherit;}
.ed-header{background:#111;color:#D4AF37;padding:18px;border-radius:18px;border:1px solid #D4AF37;text-align:center;}
.ed-header b{font-size:18px;letter-spacing:1px;}
.ed-header p{color:#fff;font-size:11px;opacity:.8;margin:6px 0 0;}
.ed-card{background:#fff;padding:18px;border-radius:18px;margin-top:14px;border:1px solid #EDE3C8;box-shadow:0 4px 18px rgba(0,0,0,.06);}
.ed-card h3{margin:0 0 12px 0;font-size:16px;color:#111;border-bottom:2px solid #D4AF37;padding-bottom:8px;}
.ed-card label{font-size:12px;font-weight:800;color:#555;display:block;margin-top:10px;}
.ed-card input, .ed-card textarea, .ed-card select{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid #E5DCC0;background:#FFFEFB;font-size:14px;outline:none;box-sizing:border-box;margin-top:4px;}
.ed-card input:focus, .ed-card textarea:focus{border-color:#D4AF37;box-shadow:0 0 0 3px rgba(212,175,55,.15);}
.ed-upload{width:100%;padding:14px;border:2px dashed #D4AF37;border-radius:14px;background:#FFF9E6;text-align:center;font-weight:800;color:#8A6D00;cursor:pointer;display:block;margin-top:6px;}
.ed-upload::file-selector-button{background:#111;color:#D4AF37;border:none;padding:10px 16px;border-radius:10px;font-weight:800;cursor:pointer;margin-right:10px;}
.ed-room{border:2px solid #E9DCC3;border-radius:18px;padding:14px;margin-bottom:16px;background:#FFFEFB;}
.ed-save{width:100%;background:#111;color:#D4AF37;border:none;padding:18px;border-radius:14px;font-weight:900;font-size:16px;margin-top:16px;box-shadow:0 8px 20px rgba(0,0,0,.2);}
.ed-save:active{transform:scale(.98);}
.ed-preview img{width:100%;height:140px;object-fit:cover;border-radius:12px;margin-top:8px;border:1px solid #eee;}
/* === LUMINA EDITOR FIX - PASTE AT BOTTOM === */
#list input[type="text"], #list input[type="number"], #list input[type="email"], #list input[type="tel"], #list textarea, #list select{
  width:100% !important; padding:12px 14px !important; border-radius:12px !important;
  border:1.5px solid #E5DCC0 !important; background:#FFFEFB !important; font-size:14px !important;
  box-sizing:border-box !important; margin-top:4px !important;
}
/* Choose File - make am gold + black, not plain */
#list input[type="file"]{
  width:100% !important; padding:12px !important; border:2px dashed #D4AF37 !important;
  border-radius:12px !important; background:#FFF9E6 !important; font-size:13px !important; cursor:pointer !important;
}
#list input[type="file"]::file-selector-button{
  background:#111 !important; color:#D4AF37 !important; border:none !important;
  padding:10px 16px !important; border-radius:10px !important; font-weight:800 !important; cursor:pointer !important;
}
/* Checkboxes - small + aligned, not big scattered */
#list input[type="checkbox"]{
  width:18px !important; height:18px !important; accent-color:#D4AF37 !important;
  margin:0 6px 0 0 !important; vertical-align:middle !important; flex-shrink:0 !important;
}
#list label:has(input[type="checkbox"]){
  display:inline-flex !important; align-items:center !important; gap:6px !important;
  background:#FFFEFB !important; border:1px solid #E8DCC0 !important; padding:7px 10px !important;
  border-radius:20px !important; font-size:12px !important; font-weight:700 !important; margin:4px 4px 4px 0 !important;
}
/* Show / Featured checkboxes - make dem side by side */
#list label[style*="display:flex"]{
  display:inline-flex !important; width:48% !important; margin-right:4px !important;
  background:#FFF9E6 !important; padding:10px !important; border-radius:12px !important; border:1px solid #E8DCC0 !important;
}
/* Cards */
#list > div{border-radius:18px !important;}

/* === MONEY CARDS ONLY - NOTHING ELSE === */
.stats{
  gap:10px;
}
.stat-card{
  padding:18px 10px 16px;
  box-shadow:0 6px 18px rgba(0,0,0,.07);
  position:relative;
  overflow:hidden;
}
/* Thin gold line on top - luxury touch */
.stat-card::after{
  content:''; position:absolute; left:0; right:0; top:0; height:3px;
  background:linear-gradient(90deg, #D4AF37, #F5E6A8, #D4AF37);
}
/* Numbers - make dem bigger + bolder */
.stat-card b{
  font-size:23px;
  letter-spacing:.3px;
  line-height:1.1;
}
/* Labels - small + spaced */
.stat-card p{
  letter-spacing:1.2px;
  margin-top:6px;
}

/* 1. Total Revenue - GOLD LETTER ON BLACK */
.stat-card.gold{
  background:linear-gradient(135deg, #111, #222) !important;
  border:1px solid #D4AF37 !important;
}
.stat-card.gold b{ color:#D4AF37 !important; }
.stat-card.gold p{ color:#FFF8DC !important; }

/* 2. Bookings - BLACK LETTER ON WHITE */
.stat-card:nth-child(2){
  background:#fff !important;
  border:1px solid #EDE0C0 !important;
}
.stat-card:nth-child(2) b{ color:#111 !important; }
.stat-card:nth-child(2) p{ color:#888 !important; }

/* 3. Awaiting / Balance - BLACK LETTER ON SOFT GOLD */
.stat-card:nth-child(3){
  background:#FFF9E6 !important;
  border:1px solid #D4AF37 !important;
}
.stat-card:nth-child(3) b{ color:#8A6D00 !important; }
.stat-card:nth-child(3) p{ color:#8A6D00 !important; }


/* === MONEY TAB PAGE ONLY - NOTHING ELSE === */
body.money-page #list{
  gap:14px;
}
/* All cards for Money page - luxury */
body.money-page #list > div{
  border-radius:20px !important;
  border:1px solid #EDE0C0 !important;
  box-shadow:0 6px 20px rgba(0,0,0,.06) !important;
  padding:20px !important;
  background:#fff !important;
  position:relative;
  overflow:hidden;
}
/* Gold line on top of each Money card */
body.money-page #list > div::before{
  content:''; position:absolute; left:0; right:0; top:0; height:4px;
  background:linear-gradient(90deg, #D4AF37, #F5E6A8, #D4AF37);
}
/* Titles - Daily Report, Balances, Expenses */
body.money-page #list > div b:first-child,
body.money-page #list > div strong{
  font-size:15px !important;
  letter-spacing:.3px;
  color:#111 !important;
}
/* Daily Report card - make am BLACK + GOLD, na the main card */
body.money-page #list > div:first-child{
  background:#161616 !important;
  border:1px solid #D4AF37 !important;
}
body.money-page #list > div:first-child b,
body.money-page #list > div:first-child strong{
  color:#D4AF37 !important;
}
body.money-page #list > div:first-child div{
  color:#111 !important;
}
/* Profit line - make am pop */
body.money-page #list > div:first-child b:last-child{
  color:#D4AF37 !important;
}
/* Balances Still Owed card - SOFT GOLD */
body.money-page #list > div:nth-child(2){
  background:#FFF9E6 !important;
  border-color:#D4AF37 !important;
}
body.money-page #list > div:nth-child(2) b{
  color:#8A6D00 !important;
}
/* Expenses card - WHITE + gold Add button */
body.money-page #list > div:last-child{
  background:#fff !important;
  color:#111
}



</style>

<script>
// ===== LOGOUT - FIXED: No LOGIN_KEY, clears everything =====
function logoutAdmin(){
  if(!confirm("Logout?")) return;
  try{
    localStorage.removeItem('lumina_admin');
    localStorage.removeItem('lumina_role');
    localStorage.removeItem('lumina_staff');
    // Clear session storage too, just in case
    sessionStorage.clear();
  }catch(e){ console.log('Logout clear error:', e); }

    clearLoginFields();
  // Force reload with cache bypass so login screen show
  location.href = location.pathname + '?logout=' + Date.now();
}
function adminLogout(){ logoutAdmin(); }
document.addEventListener('DOMContentLoaded', ()=>{
  checkLogin();
  const passInput = document.getElementById('adminPassInput');
  if(passInput){ passInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') loginAdmin(); }); }
});
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwR1T2dlroFlXNZq20is5C1hc2xrHY2jRTKtAUhUKSBgDxmXdmN28oz0tAL9clv2TteSQ/exec";

let allData = [];
let roomsData = [];
let currentTab = 'all';
let isLoading = false;
let isSaving = false;


// ===== LOADING STATE HELPER - Shows "Processing..." for all major actions =====
let _btnOriginal = {};

function setBtnLoading(btn, loadingText){
  if(!btn) return;
  // Save original text once
  if(!_btnOriginal[btn.id] && btn.id){
    _btnOriginal[btn.id] = btn.innerHTML;
  }
  btn.disabled = true;
  btn.style.opacity = '0.6';
  btn.style.pointerEvents = 'none';
  btn.innerHTML = `⏳ ${loadingText}`;
}

function resetBtnLoading(btn){
  if(!btn) return;
  if(btn.id && _btnOriginal[btn.id]){
    btn.innerHTML = _btnOriginal[btn.id];
  }

async function doAdminLogin(){
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  if(!username || !password) return alert('Enter username + password');
  
  const btn = document.querySelector('#loginCard button'); // your Login button
  const oldText = btn ? btn.innerHTML : '';
  if(btn){ btn.disabled = true; btn.innerHTML = '⏳ Logging in... Please wait...'; btn.style.opacity = '0.6'; }
  showPageLoader('Logging in...');

  try{
    const res = await fetch(SCRIPT_URL, {method:'POST', body: JSON.stringify({action:'login', username, password})});
    const data = await res.json().catch(()=>({}));
    if(data.ok){
      currentAdminUser = data;
      currentRole = (data.role||'').toLowerCase();
      localStorage.setItem('lumina_admin', JSON.stringify(data));
      localStorage.removeItem('lumina_role');
      localStorage.removeItem('lumina_staff');
      document.getElementById('loginCard').style.display='none';
      document.getElementById('adminMain').style.display='block';
      applyRoleUI(); renderTab();
    } else {
      const err = document.getElementById('loginError');
      if(err){ err.style.display='block'; err.innerText = data.error || 'Login failed'; }
      else alert(data.error || 'Login failed');
    }
  }catch(e){
    alert('Login failed: ' + e.message);
  } finally {
    hidePageLoader();
    if(btn){ btn.disabled = false; btn.innerHTML = oldText || 'Login'; btn.style.opacity = '1'; }
  }
}

async function uploadImageFromPhone(inputId, previewId, hiddenId){
  const file = document.getElementById(inputId).files[0];
  if(!file) return;
  const preview = document.getElementById(previewId);
  if(preview) preview.innerHTML = '⏳ Uploading... Wait...';
  const reader = new FileReader();
  reader.onload = async (ev)=>{
    const base64 = ev.target.result.split(',')[1];
    const res = await fetch(SCRIPT_URL,{method:'POST', body: JSON.stringify({action:'uploadWebsiteImage', base64, name: file.name, mime: file.type, folder:'Lumina Website Images'})});
    const data = await res.json().catch(()=>({}));
    if(data.ok){
      document.getElementById(hiddenId).value = data.url;

  reader.readAsDataURL(file);
}

function collectRoomsFromEditor(){
  const allAmens = ["WiFi","Breakfast","Pool","Spa","Garden","Beach"];
  return editorConfig.rooms.map((old,i)=>{
    const amen = allAmens.filter(a=> document.getElementById(`ed-room-${i}-amen-${a}`)?.checked);
    const insideKeys = ['bath','wardrobe','bedroom','balcony'];
    const inside = {};
    insideKeys.forEach(k=>{
      inside[k] = {
        title: document.getElementById(`ed-room-${i}-inside-${k}-title`)?.value||"",
        desc: document.getElementById(`ed-room-${i}-inside-${k}-desc`)?.value||"",
        img: document.getElementById(`ed-room-${i}-inside-${k}-img`)?.value||""
      };
    });
    return {
      id: old.id||(i+1),
      name: document.getElementById(`ed-room-${i}-name`)?.value||"",
      price: Number(document.getElementById(`ed-room-${i}-price`)?.value||0),
      bed: document.getElementById(`ed-room-${i}-bed`)?.value||"King",
      total: Number(document.getElementById(`ed-room-${i}-total`)?.value||5),
      about: document.getElementById(`ed-room-${i}-about`)?.value||"",
      cardText: document.getElementById(`ed-room-${i}-cardText`)?.value||"",
      amen, inside,
      img: document.getElementById(`ed-room-${i}-img`)?.value||"",
      img2: document.getElementById(`ed-room-${i}-img2`)?.value||"",
      img3: document.getElementById(`ed-room-${i}-img3`)?.value||"",
      active: document.getElementById(`ed-room-${i}-active`)?.checked,
      featured: document.getElementById(`ed-room-${i}-featured`)?.checked
    };
  });
}

function getMonthlyData(monthKey){
  // monthKey like "2026-11"
  const bookings = window.allData || [];
  // Expenses dey inside Money? For now use window.allExpenses if you get am, else 0
  const expenses = window.allExpenses || window.expenses || [];

  const monthBookings = bookings.filter(b => {
    const d = String(b.checkin || b.date || b.created || "");
    return d.startsWith(monthKey);
  });

  const monthExpenses = expenses.filter(e => String(e.date||"").startsWith(monthKey));

  const revenue = monthBookings.reduce((s,b) => s + (parseFloat(b.amount)||0), 0);
  const expTotal = monthExpenses.reduce((s,e) => s + (parseFloat(e.amount)||0), 0);
  const owed = monthBookings.reduce((s,b) => s + (parseFloat(getBalance ? getBalance(b) : b.balance || 0)||0), 0);

  return {
    month: monthKey,
    revenue, expenses: expTotal, profit: revenue - expTotal, owed,
    totalBookings: monthBookings.length,
    checkedIn: monthBookings.filter(b => String(b.status||"").includes('Checked-In')).length,
    checkedOut: monthBookings.filter(b => String(b.status||"").includes('Checked-Out')).length,
    cancelled: monthBookings.filter(b => String(b.status||"").includes('Cancelled')).length,
    occupancy: Math.min(100, Math.round(monthBookings.length / 30 * 100))
  };
}

function archiveThisMonth(){

  let archives = JSON.parse(localStorage.getItem('monthlyArchives')||"[]");

  archives.unshift({...d, savedAt: new Date().toLocaleString()});

}

// ===== CLEAN DATE — No time, no GMT, no West Africa =====
function fmtDate(d){
  if(!d) return '';
  // If e be like "2026-11-21T00:00:00.000Z" or "2026-11-21", take only first part
  const onlyDate = String(d).slice(0,10); // "2026-11-21"
  const parts = onlyDate.split('-');
  if(parts.length !== 3) return onlyDate;
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const y = parts[0], m = Number(parts[1]), day = Number(parts[2]);
  return `${day} ${months[m-1]} ${y}`; // "21 Nov 2026"
}
function getGuestsRooms(b){
  // Your Sheets get guests as "2 guests · 1 room" or separate fields
  // We try all possibilities, so e go show even if one miss
  const g = b.guests || b.guestCount || b.numGuests || '';
  const r = b.rooms || b.numRooms || b.roomCount || '';
  // If guests field already contains "2 guests · 1 room", use am directly
  if(String(g).includes('guest') || String(g).includes('room')) return String(g);
  let out = '';
  if(g) out += `${g} guest${Number(g)>1?'s':''}`;
  if(r) out += (out ? ' · ' : '') + `${r} room${Number(r)>1?'s':''}`;
  if(!out && b.guests) out = String(b.guests);
  if(!out) out = '2 guests · 1 room'; // fallback if Sheets no get am
  return out;
}

function getSubRoomsForType(roomType, indexInList){
  // Fixed mapping for your 3 types
  if(roomType.toLowerCase().includes('grand') || roomType.toLowerCase().includes('opera')) return ["101","102","103","104","105"];
  if(roomType.toLowerCase().includes('river') || roomType.toLowerCase().includes('fl ')) return ["106","107","108","109","110"];
  if(roomType.toLowerCase().includes('montreal') || roomType.toLowerCase().includes('boutique')) return ["111","112","113","114","115"];
  // Fallback: if na new room type, generate 201,202... based on total
  const total = roomsData[indexInList]?.total || 5;
  const start = 201 + (indexInList * 10);
  return Array.from({length: total}, (_,i)=> String(start+i));
}

// roomNumber -> "dirty", if no entry = clean
// We reuse your existing lumina_room_status, but now per ROOM NUMBER, not roomType
function getRoomStatus(roomType, roomNumber){
  const today = new Date().toISOString().slice(0,10);
  // Find booking wey dey use this exact roomNumber
  const bookingForRoom = allData.find(b => bookingRooms[b.code] === roomNumber && b.room === roomType);

  // 1. OCCUPIED - status na Checked-In
  if(bookingForRoom && String(bookingForRoom.status||'').includes('Checked-In')){
    return { status:'Occupied', label:'Occupied', color:'#fef3c7', border:'#eab308', booking: bookingForRoom };
  }
  // 2. RESERVED TODAY - checkin na today, never check-in yet, never cancelled / checked-out
  if(bookingForRoom && String(bookingForRoom.checkin||'').slice(0,10) === today){
    const s = String(bookingForRoom.status||'');
    if(!s.includes('Checked-Out') && !s.includes('Cancelled') && !s.includes('Disapproved')){
      return { status:'Reserved', label:'Reserved Today', color:'#dbeafe', border:'#3b82f6', booking: bookingForRoom };
    }
  }
  // 3. DIRTY - Cleaner never clean am
  if(roomStatus[roomNumber] === 'Dirty' || roomStatus[roomNumber] === 'dirty'){
    return { status:'Dirty', label:'Dirty — Go Clean', color:'#fee2e2', border:'#ef4444', booking: null };
  }
  // 4. FREE & CLEAN
  return { status:'Free', label:'Free & Clean', color:'#dcfce7', border:'#22c55e', booking: null };
}

function getAvailableRoomNumbers(roomType, indexInList){
  const subs = getSubRoomsForType(roomType, indexInList);
  return subs.filter(num => getRoomStatus(roomType, num).status === 'Free');

// ===== FIXED MONEY LOGIC =====
function getFoodBill(code){
  return posOrders.filter(o=>o.code===code).reduce((s,o)=>s+(Number(o.price)*Number(o.qty||1)),0);
}
function getTotalBill(b){
  return Number(b.amount||0) + getFoodBill(b.code);
}
function getPaidAmount(b){
  const st = String(b.status||'');
  const totalBill = getTotalBill(b);

  // RULE 1: Checked-Out = assume don pay all — ONLY here we clear balance
  if(st.includes('Checked-Out')) return totalBill;

  // RULE 2: FIRST check PAID:xxx — this na the real money guest pay
  // E.g. PAID:500 for $1260 booking → return 500, no be 1260
  const la = String(b.lastAction||'');
  if(la.indexOf('PAID:')===0) return Number(la.replace('PAID:',''))||0;

  // RULE 3: If no PAID: record, and status na Paid (old bookings wey don pay before we start tracking), then assume full room amount
  // But if status na Approved, e NO mean Paid — Approved = 0 paid
  if(st === 'Paid') return Number(b.amount||0);

  // Approved / Unpaid / Awaiting / Checked-In with no PAID: = 0 paid
  return 0;
}

function getBalance(b){
  const st = String(b.status||'');
  if(st.includes('Checked-Out') || st.includes('Cancelled')) return 0;
  // Balance = (Room + Food) - Paid
  // Example: Room $1260 + Food $20 = $1280 - Paid $500 = Balance $780
  // When guest order food for POS, getFoodBill go increase, Balance go increase automatically
  return Math.max(0, getTotalBill(b) - getPaidAmount(b));
}

// Call this instead of updateStatus(code,'Checked-In') directly
function openCheckinWithPayment(code){
  const b = allData.find(x=>x.code===code); if(!b) return;
  const totalBill = getTotalBill(b);
  const alreadyPaid = getPaidAmount(b);
  const bal = Math.max(0, totalBill - alreadyPaid);
  // Find index of this roomType for sub-rooms
  const roomIdx = roomsData.findIndex(r=>r.roomType===b.room);
  const available = getAvailableRoomNumbers(b.room, roomIdx);
  // If guest already get room before, show am, else show available
  const alreadyAssigned = bookingRooms[code];
  const options = alreadyAssigned
    ? `<option value="${alreadyAssigned}" selected>Room ${alreadyAssigned} (Already assigned)</option>` + available.filter(n=>n!==alreadyAssigned).map(n=>`<option value="${n}">Room ${n} - Free & Clean</option>`).join('')
    : available.length ? available.map(n=>`<option value="${n}">Room ${n} - Free & Clean</option>`).join('') : `<option value="">No free rooms for ${b.room}</option>`;

  openAdminAction('🏨 Check-In — Collect Payment', `
    <p style="font-size:13px;">${b.name} • ${b.room}<br>Total Bill: <b>$${totalBill}</b> • Already Paid: $${alreadyPaid} • <b style="color:#991b1b;">Balance: $${bal}</b></p>
    <label style="font-size:12px;font-weight:800;">Select Room Number (Only Free & Clean)</label>
    <select id="checkinRoomNumber" style="width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;margin:6px 0;">${options}</select>
    <label style="font-size:12px;font-weight:800;">How much guest dey pay now at Check-In?</label>
    <input id="checkinPayAmt" type="number" value="${bal}" style="width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;margin:6px 0;">
    <label style="font-size:12px;font-weight:800;">Payment Method</label>
    <select id="checkinPayMethod" style="width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;"><option>Cash at Reception</option><option>OPay Transfer</option><option>Bank Transfer</option><option>Paystack</option><option>Pay Later — Still Owing</option></select>
    <button onclick="confirmCheckinWithPayment('${code}')" style="width:100%;background:#111;color:#D4AF37;border:none;padding:13px;border-radius:10px;font-weight:900;margin-top:12px;">✅ Check-In Guest</button>
  `);
}
async function confirmCheckinWithPayment(code){
  const btn = document.querySelector('#adminActionModal button'); // the Check-In button inside modal
  if(btn){ btn.disabled = true; btn.innerHTML = '⏳ Checking In... Please wait...'; }
  showPageLoader('Checking In... Collecting payment...');

  try{
    const amt = Number(document.getElementById('checkinPayAmt').value||0);
    const method = document.getElementById('checkinPayMethod').value;
    // Save room assignment first (from last fix)
    const roomNum = document.getElementById('checkinRoomNumber')?.value;
    if(roomNum){ bookingRooms[code] = roomNum; saveBookingRooms(); }
    closeAdminAction();

    if(amt > 0 && !method.includes('Pay Later')){
      await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",body:JSON.stringify({action:"recordCash", code, cashAmount: amt, payMethod: method})});
      await new Promise(r=>setTimeout(r,800));
    }
    await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",body:JSON.stringify({action:"updateStatus", code, newStatus:"Checked-In"})});
    alert(`Checked-In! Collected $${amt} via ${method}`);
    setTimeout(loadAll,1500);
  }catch(e){
    alert('Check-In failed: ' + e.message);
  } finally {
    hidePageLoader();
    // Button dey inside modal wey don close, no need to reset am
  }
}

// Check-Out: Assume don pay all — auto-clear balance
async function checkoutWithBill(code){
  const b = allData.find(x=>x.code===code);
  const totalBill = getTotalBill(b);
  const bal = getBalance(b);
  if(!confirm(`Check-Out ${b.name}?\nTotal Bill: $${totalBill}\nBalance: $${bal}\n\nClick OK to mark as FULLY PAID and Check-Out.`)) return;

  showPageLoader('Checking Out... Collecting balance... Please wait...');
  try{
    if(bal > 0){
      await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",body:JSON.stringify({action:"recordCash", code, cashAmount: bal, payMethod: "Cash at Reception - Check-Out"})});
      await new Promise(r=>setTimeout(r,800));
    }
    await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",body:JSON.stringify({action:"updateStatus", code, newStatus:"Checked-Out"})});

    // Room go Dirty automatically
    const roomNum = bookingRooms[code];
    if(roomNum){
      roomStatus[roomNum] = 'Dirty';
      localStorage.setItem('lumina_room_status', JSON.stringify(roomStatus));
    }

    alert(`Checked-Out ${b.name}. Total collected: $${totalBill}. Balance cleared ✅`);
    setTimeout(loadAll,1500);
  }catch(e){
    alert('Check-Out failed: ' + e.message);
  } finally {
    hidePageLoader();
  }
}
function adminExtend(code){
  const b = allData.find(x=>x.code===code); if(!b) return;
  const oldN = Math.max(1, Math.round((new Date(b.checkout)-new Date(b.checkin))/86400000));
  const perNight = Math.round((Number(b.amount)||0)/oldN);
  openAdminAction('➕ Extend Stay', `
    <p style="font-size:13px;">${b.room} • ${b.checkin} → ${b.checkout} • $${b.amount} • Per night: $${perNight}</p>
    <label style="font-size:12px;font-weight:800;">Extra Nights</label>
    <input id="extNights" type="number" value="1" min="1" max="30" style="width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;margin:6px 0;" oninput="document.getElementById('extPreview').innerText='Extra: $'+(${perNight}*Number(this.value||1))+' • New total: $'+(${Number(b.amount)||0}+${perNight}*Number(this.value||1)))">
    <div id="extPreview" style="background:#f8f5ef;padding:10px;border-radius:10px;font-size:12px;">Extra: $${perNight} • New total: $${Number(b.amount)+perNight}</div>
    <label style="font-size:12px;font-weight:800;display:block;margin-top:10px;">Guest don pay for extension?</label>
    <select id="extPay" style="width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;margin-top:6px;"><option value="Cash at Reception">Cash at Reception — Paid Now</option><option value="OPay Transfer">OPay Transfer — Receipt don come</option><option value="Paystack">Paystack — Paid</option><option value="Pending">Pending — Guest go pay later (Awaiting)</option></select>
    <button onclick="confirmAdminExtend('${code}', ${perNight})" style="width:100%;background:#111;color:#D4AF37;border:none;padding:13px;border-radius:10px;font-weight:900;margin-top:12px;">Confirm Extend</button>
  `);
}
async function confirmAdminExtend(code, perNight){
  const extra = Number(document.getElementById('extNights').value||1);
  const pay = document.getElementById('extPay').value;
  const b = allData.find(x=>x.code===code);
  const newCheckout = new Date(b.checkout); newCheckout.setDate(newCheckout.getDate()+extra);
  const iso = newCheckout.toISOString().slice(0,10);
  const newTotal = Number(b.amount)+perNight*extra;
  closeAdminAction();
  if(pay==='Pending'){
    await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",body:JSON.stringify({action:"extend_cash", code, newCheckout: iso, newAmount: newTotal, extraNights: extra, extraAmount: perNight*extra})});
    alert(`Extension requested — Pending. Checkout go change to ${iso} once you approve payment.`);
  } else {
    await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",body:JSON.stringify({action:"extend_paystack", code, newCheckout: iso, newAmount: newTotal, extraNights: extra, extraAmount: perNight*extra, paystackRef: pay})});
    alert(`Extended +${extra} night(s)! New checkout ${iso} • New total $${newTotal}`);
  }
  setTimeout(loadAll,1500);
}

async function updateStatus(code,newStatus){
  const approveBtn = document.getElementById(`approve-${code}`);
  const checkinBtn = document.getElementById(`checkin-${code}`);
  if(!confirm(`Change ${code} to ${newStatus}?`)) return;
  
  showPageLoader(`Updating to ${newStatus}...`);

  if(newStatus === 'Approved'){
    if(approveBtn){
      approveBtn.disabled = true;
      approveBtn.innerText = "✅ Approved";
      approveBtn.style.opacity = "0.5";
    }
    if(checkinBtn){
      checkinBtn.disabled = false;
      checkinBtn.style.opacity = "1";
    }
  }
  if(newStatus === 'Checked-In' && checkinBtn){
    checkinBtn.disabled = true;
    checkinBtn.innerText = "🏨 Checking-In...";
  }

  await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",body:JSON.stringify({action:"updateStatus",code,newStatus})}); 
  hidePageLoader();
  setTimeout(loadAll,1500); 
}
